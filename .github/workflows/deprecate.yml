name: Deprecate

on:
  workflow_dispatch:

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Deprecate 0.1.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm deprecate "@agentghost/vercel@0.1.0" "Broken dependency metadata; use >=0.1.1"
          npm deprecate "@agentghost/langchain@0.1.0" "Broken dependency metadata; use >=0.1.1"
          npm deprecate "@agentghost/openai@0.1.0" "Broken dependency metadata; use >=0.1.1"
